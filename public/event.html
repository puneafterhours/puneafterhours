<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan - PuneAfterhours</title>
<meta name="description" content="A meetup proposal. Say you're in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="moon-sm">🌙</span> PuneAfterhours</div>
  <nav class="tabs"><a href="/">🏠 Home</a><a href="/roll">🎂 Add birthday</a><a href="/wall">🌙 Wall</a><a href="/events">📅 Plans</a><a href="/propose">📣 Propose</a></nav>
  <div id="ev"><div class="empty">Loading…</div></div>
</div>
<script>
const id=new URLSearchParams(location.search).get('id');
function esc(s){const d=document.createElement('span');d.textContent=s;return d.innerHTML;}
fetch('/api/events?id='+encodeURIComponent(id)).then(r=>r.json()).then(({event:e})=>{
  const box=document.getElementById('ev');
  if(!e){box.innerHTML='<div class="empty">Plan not found.</div>';return;}
  box.innerHTML=`
    <span class="tag" id="st">${e.status==='locked'?'locked in - confirmed by the host':'proposal - not confirmed yet'}</span>
    <h1>${esc(e.title)}</h1>
    <p class="sub">${esc([e.when,e.area].filter(Boolean).join(' · '))}</p>
    <div class="card">
      <p style="margin-top:0;white-space:pre-wrap">${esc(e.details||'')}</p>
      <p class="hint" id="who"></p>
      <p class="hint">Proposed by ${esc(e.name)}</p>
      <div class="count" id="count">${e.going} going · ${e.maybe} maybe</div>
      <p class="hint">One RSVP per name - use the same name to change or remove yours. We can't verify identity.</p>
      <form id="f">
        <label for="name">Your name</label>
        <input type="text" id="name" maxlength="40" required>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
        <label>Are you in?</label>
        <div class="choices" id="rsvp">
          <button type="button" data-v="going">🙌 I'm in</button>
          <button type="button" data-v="maybe">🤔 Maybe</button>
        </div>
        <button class="send" id="send" type="submit" disabled>RSVP</button>
        <button class="send" id="rm" type="button" style="background:transparent;border:1px solid #4a2c32;color:var(--dim);display:none;margin-top:8px">Remove my RSVP</button>
        <div class="done" id="done">You're on the list. The host confirms it by locking the plan.</div>
      </form>
    </div>
    <div class="card" id="mg" style="display:none"><b>Host controls</b><div class="choices" id="mact" style="margin-top:10px"><button type="button" data-a="lock">🔒 Lock it in</button><button type="button" data-a="unlock">↩ Back to proposal</button><button type="button" data-a="cancel">✖ Cancel plan</button><button type="button" data-a="delete">🗑 Delete</button></div><div class="hint" id="mmsg"></div></div>
    <a class="wall-link" href="/events">← All plans</a>`;
  const key=new URLSearchParams(location.search).get('k')||(()=>{try{return localStorage.getItem('mk:'+id)}catch{return null}})();
  if(key){document.getElementById('mg').style.display='block';
    document.getElementById('mact').addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a;if((a==='delete'||a==='cancel')&&!confirm(a+' this plan?'))return;
      const r=await fetch('/api/manage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,key,action:a})});
      const m=document.getElementById('mmsg');
      if(!r.ok){m.textContent='That did not work (wrong or expired key).';return;}
      const j=await r.json();m.textContent='Done: '+j.status+'.';
      if(j.status==='deleted'||j.status==='cancelled'){setTimeout(()=>location.href='/events',900);return;}
      document.getElementById('st').textContent=j.status==='locked'?'locked in - confirmed by the host':'proposal - not confirmed yet';});}
  let status='';
  const send=document.getElementById('send'),name=document.getElementById('name');
  document.getElementById('rsvp').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;document.querySelectorAll('#rsvp button').forEach(x=>x.classList.toggle('on',x===b));status=b.dataset.v;send.disabled=!(name.value.trim()&&status);});
  name.addEventListener('input',()=>{send.disabled=!(name.value.trim()&&status);});
  document.getElementById('f').addEventListener('submit',async ev=>{
    ev.preventDefault();send.disabled=true;
    try{
      const r=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name:name.value.trim(),status,website:document.getElementById('website').value,rt:rtoken()})});
      if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.message||'Something glitched. Try again?');send.disabled=false;return;}
      const j=await r.json();
      document.getElementById('count').textContent=j.going+' going · '+j.maybe+' maybe';
      if(j.rt){try{localStorage.setItem('rt:'+id+':'+name.value.trim().toLowerCase(),j.rt);}catch{}}
      document.getElementById('done').style.display='block';send.textContent='Done';document.getElementById('rm').style.display='block';
      if(j.previous)alert('Updated your RSVP (was: '+j.previous+').');
    }catch{send.disabled=false;alert('Something glitched. Try again?');}
  });
  const rtoken=()=>{try{return localStorage.getItem('rt:'+id+':'+name.value.trim().toLowerCase())||''}catch{return ''}};
  document.getElementById('rm').addEventListener('click',async()=>{
    if(!name.value.trim()){alert('Enter the name you RSVPed with first.');return;}
    const r=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,name:name.value.trim(),cancel:true,rt:rtoken()})});
    if(!r.ok){const e=await r.json().catch(()=>({}));alert(e.message||'Could not remove.');return;}
    {const j=await r.json();document.getElementById('count').textContent=j.going+' going · '+j.maybe+' maybe';document.getElementById('done').style.display='none';document.getElementById('rm').style.display='none';send.textContent='RSVP';}
  });
}).catch(()=>{document.getElementById('ev').innerHTML='<div class="empty">Could not load. Try refreshing.</div>';});
</script>
</body>
</html>
